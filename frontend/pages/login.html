<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Classroom Roster</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🏫</div>
        <div>
          <h2>Classroom Roster</h2>
          <span>Premium Edition</span>
        </div>
      </div>

      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to your exclusive teacher account</p>

      <div id="alert" class="alert"></div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="teacher@school.edu" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">
        ✦ Sign In
      </button>

      <p class="auth-link">Don't have an account? <a href="signup.html">Create one</a></p>
      <p class="auth-link" style="margin-top:8px;font-size:0.78rem;color:var(--text-dim)">
        Demo: <strong style="color:var(--gold)">admin@school.edu</strong> /
        <strong style="color:var(--gold)">password</strong>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    redirectIfAuth();

    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        showAlert('alert', 'Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      const res = await Auth.login(email, password);
      btn.disabled = false;
      btn.innerHTML = '✦ Sign In';

      if (res && res.ok) {
        setToken(res.data.data.token);
        setUser(res.data.data.user);
        showAlert('alert', 'Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        showAlert('alert', res?.data?.message || 'Login failed. Please try again.');
      }
    }
  </script>
</body>
</html>
